# 1. 工作流名称（显示在 Actions 列表里）
name: 基础CI检查

# 2. 触发条件：什么时候自动运行
on:
  push:
    branches: [ main ]   # 向 main 分支推送代码时触发
  pull_request:
    branches: [ main ]   # 向 main 分支提 PR 时触发

# 3. 具体执行的任务
jobs:
  build:                  # 任务ID，自定义
    runs-on: ubuntu-latest # 运行环境：最新版 Ubuntu 系统
    steps:
      # 步骤1：拉取当前仓库的代码
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 步骤2：执行自定义命令
      - name: 测试运行
        run: echo "CI 运行成功"
